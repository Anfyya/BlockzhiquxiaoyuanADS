name: Build BlockzhiquxiaoyuanADS.dylib

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version

      - name: Build dylib
        run: bash ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockzhiquxiaoyuanADS.dylib
          path: BlockzhiquxiaoyuanADS.dylib
